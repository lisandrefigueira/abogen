<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LeitorVoz{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <script src="https://unpkg.com/hyperscript.org@0.9.12"></script>
</head>
<body>
  <header class="top-bar">
    <div class="brand">
      <span class="brand__mark">🎧</span>
      <span class="brand__name">LeitorVoz</span>
      <span class="brand__tagline">Ouça seus livros</span>
    </div>
    <nav class="top-actions">
      {% set endpoint = request.endpoint or '' %}
      <a href="{{ url_for('main.index') }}" class="btn{% if endpoint == 'main.index' %} is-active{% endif %}">Início</a>
      <a href="{{ url_for('voices.voice_profiles') }}" class="btn{% if endpoint == 'voices.voice_profiles' %} is-active{% endif %}">Vozes</a>
      <a href="{{ url_for('entities.entities_page') }}" class="btn{% if endpoint == 'entities.entities_page' %} is-active{% endif %}">Ajustes TTS</a>
      <a href="{{ url_for('jobs.queue_page') }}" class="btn{% if endpoint in ['jobs.queue_page', 'jobs.job_detail'] %} is-active{% endif %}">Fila</a>
      <a href="{{ url_for('settings.settings_page') }}" class="btn{% if endpoint == 'settings.settings_page' %} is-active{% endif %}">Configurações</a>
    </nav>
  </header>
  <main class="main">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <span>Precisa de ajuda?</span>
    <a href="https://github.com/lisandrefigueira/abogen" target="_blank" rel="noopener">Documentação</a>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
